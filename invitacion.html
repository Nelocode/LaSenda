<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Invitación Exclusiva | La Senda®</title>
  
  <!-- SEO & Social Meta Tags -->
  <meta name="description" content="Te invitamos al lanzamiento exclusivo de La Senda. Vive el retorno a lo esencial en Titiribí, Antioquia.">
  <meta property="og:title" content="Invitación Exclusiva | La Senda®">
  <meta property="og:description" content="Lanzamiento privado de parcelas premium. Confirma tu asistencia y agenda el evento.">
  <meta property="og:type" content="website">
  <meta property="og:image" content="assets/img/encuentro_1.webp">
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Simonetta:ital,wght@0,400;0,900;1,400;1,900&display=swap" rel="stylesheet">
  
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Poster Image Preload -->
  <link rel="preload" as="image" href="assets/img/encuentro_1.webp" fetchpriority="high" type="image/webp">

  <!-- Stylesheets -->
  <link rel="stylesheet" href="invitacion.css">
</head>
<body>

  <!-- Video Progress Timeline Bar (Runs at top of screen) -->
  <div class="video-progress-container">
    <div class="video-progress-bar" id="video-progress-bar"></div>
  </div>

  <!-- 3-Second Hook Intro Overlay -->
  <div class="intro-overlay" id="intro-overlay" role="dialog" aria-modal="true" aria-label="Introducción a La Senda">
    <div class="intro-content">
      <span class="intro-eyebrow">La Senda®</span>
      <h1 class="intro-title">Invitación exclusiva</h1>
      <div class="intro-loader">
        <div class="intro-loader-bar"></div>
      </div>
      <button class="btn btn-enter" id="btn-enter">Abrir Invitación</button>
    </div>
  </div>

  <!-- Main Invitation Screen (Single Viewport Layout) -->
  <main class="invitation-screen">
    
    <!-- Background Video Wrapper -->
    <div class="video-background-wrapper">
      <video class="hero-video" id="hero-video" autoplay muted loop playsinline poster="assets/img/encuentro_1.webp">
        <source src="assets/img/la_senda_invitacion_optimized.mp4" type="video/mp4">
        Tu navegador no soporta reproducción de video.
      </video>
      <div class="video-tint-overlay"></div>
    </div>

    <!-- UI Overlay Elements (Structured in a Flex Layout) -->
    <div class="interface-container">
      
      <!-- Top Brand Header -->
      <header class="brand-header animate-fade-in">
        <img src="assets/img/logo_monograma.webp" alt="Isotipo La Senda" class="brand-monogram">
        <h2 class="brand-subtitle">Lanzamiento Oficial</h2>
      </header>

      <!-- Center Event Details Card -->
      <section class="event-details-section animate-fade-in-up">
        <div class="details-card">
          <span class="card-subtitle">Estás Invitado</span>
          <h2 class="card-title">El privilegio de pertenecer</h2>
          
          <div class="event-details-grid">
            <div class="detail-item">
              <div class="detail-icon"><i class="fa-solid fa-calendar-day"></i></div>
              <div class="detail-text">
                <span class="detail-label">Fecha</span>
                <span class="detail-val">Sábado, 20 de Junio, 2026</span>
              </div>
            </div>
            
            <div class="detail-item">
              <div class="detail-icon"><i class="fa-solid fa-clock"></i></div>
              <div class="detail-text">
                <span class="detail-label">Hora</span>
                <span class="detail-val">10:00 AM – 4:00 PM</span>
              </div>
            </div>
            
            <div class="detail-item">
              <div class="detail-icon"><i class="fa-solid fa-map-location-dot"></i></div>
              <div class="detail-text">
                <span class="detail-label">Lugar</span>
                <span class="detail-val">Parcelación La Senda<br><small>Titiribí, Antioquia (A 45 min de Medellín)</small></span>
              </div>
            </div>
          </div>
          
          <!-- Only WhatsApp RSVP Link, Calendar removed per client request -->
          <button class="btn btn-rsvp" id="btn-rsvp">
            <i class="fa-brands fa-whatsapp btn-icon"></i> Confirmar Asistencia
          </button>
        </div>
      </section>

      <!-- Bottom Credits Footer -->
      <footer class="credits-footer animate-fade-in-up delay-1">
        <!-- Contour line overlay curves -->
        <div class="contour-overlay curves-light"></div>
        
        <!-- Portal Image to main page (No index.html button but clicking the portal will redirect) -->
        <div class="footer-nature-portal nature-window-arch" title="Explorar La Senda">
          <div class="nature-window-img" style="background-image: url('assets/img/calma_2.webp');"></div>
        </div>
        
        <!-- Credits row with transparent inverting logos -->
        <div class="credits-row">
          <span class="credits-label">Un proyecto de</span>
          <div class="partner-logos-row">
            <img src="assets/img/logo_origen21.webp" alt="ORIGEN 21" class="partner-logo-footer logo-invert-screen" loading="lazy">
            <img src="assets/img/logo_cntxt.webp" alt="CNTXT" class="partner-logo-footer" loading="lazy">
          </div>
        </div>
      </footer>

    </div>
  </main>

  <!-- Toast Notification Container -->
  <div id="toast-container" class="toast-container"></div>

  <!-- Javascript -->
  <script src="invitacion.js"></script>
</body>
</html>
